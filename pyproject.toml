[project]
name = "tutor"
version = "0.1.0"
description = "Trợ lý gia sư Toán: chấm, chẩn đoán lỗi, gợi ý bài, báo cáo theo kỳ (multi-agent, chạy local)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "filelock>=4.2.4",
    "langchain>=1.5,<2",
    "langchain-anthropic>=1.7.10,<2",
    "langchain-openai>=1.8,<2",
    "langgraph>=1.2.22,<1.3",
    "langgraph-checkpoint-sqlite>=3.1.3,<4",
    "mcp>=2.3,<3",
    "openai>=3.42.1,<4",
    "pylatexenc==2.11",  # C-33
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
tutor = "tutor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutor"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["data", "docs"]  # one-off bank / prototype scripts

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "langgraph-cli[inmem]>=0.4.43",
    "playwright>=1.64.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff.lint.per-file-ignores]
"tests/ui/check_v3.py" = ["E501"]  # embedded JS snippets
